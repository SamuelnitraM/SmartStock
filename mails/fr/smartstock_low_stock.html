<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>{shop_name}</title>
</head>
<body style="font-family: Arial, sans-serif; color: #333333; background: #f8f8f8; padding: 24px;">
  <table width="100%" cellpadding="0" cellspacing="0" style="max-width: 600px; margin: 0 auto; background: #ffffff; border-radius: 6px;">
    <tr>
      <td style="padding: 24px;">
        <h1 style="font-size: 20px; margin: 0 0 16px; color: #c62828;">Stock partagé bas</h1>
        <p style="margin: 0 0 12px;">Le stock partagé de <strong>{product_name}</strong> (n°{product_id}) n'est plus que de <strong>{remaining}</strong>.</p>
        <p style="margin: 0 0 12px;">Seuil d'alerte : {threshold}. Pensez à réapprovisionner rapidement pour éviter la rupture de tous les formats.</p>
        <p style="margin: 0; color: #777777; font-size: 12px;">{shop_name}</p>
      </td>
    </tr>
  </table>
</body>
</html>
